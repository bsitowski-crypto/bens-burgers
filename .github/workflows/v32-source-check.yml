name: Starter stand source check
on:
  push:
    branches: [starter-stand-v32]
    paths: [v32-package-trigger.txt]
permissions:
  contents: read
jobs:
  source-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package exact proposed source
        run: tar -czf /tmp/starter-stand-source.tar.gz --exclude=.git .
      - uses: actions/upload-artifact@v4
        with:
          name: starter-stand-source
          path: /tmp/starter-stand-source.tar.gz
          retention-days: 2
