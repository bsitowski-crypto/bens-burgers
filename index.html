<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1"><meta name="theme-color" content="#17100c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Ben's Burgers"><title>Ben's Burgers</title><link rel="stylesheet" href="app-v22.css?v=22"><link rel="stylesheet" href="v22-hotfix.css?v=22"></head><body><main class="game"><header class="hud"><div class="logo">Ben's<small>BURGERS</small></div><div class="hudBox"><span>SCORE</span><strong id="score">0</strong></div><div class="hudBox shiftBox"><div class="shiftTop"><span>SHIFT <b id="served">0/10</b></span><span>⭐ <b id="perfect">0/10</b></span></div><div class="shiftTrack"><div id="shiftFill" class="shiftFill"></div></div></div><div class="hudBox comboBox">🔥 COMBO <strong id="combo">x1</strong></div><div class="hudBox timeBox">⏱ <strong id="time">94</strong></div></header><section id="customers" class="customers"></section><section class="kitchen"><div class="station"><div class="stationTitle"><span>🔥 GRIDDLE</span><span>Cook until green</span></div><div class="grillGrid"><button class="grillSlot"><i class="foodSprite"></i><span class="slotBar"><i></i></span></button><button class="grillSlot"><i class="foodSprite"></i><span class="slotBar"><i></i></span></button><button class="grillSlot"><i class="foodSprite"></i><span class="slotBar"><i></i></span></button><button class="grillSlot"><i class="foodSprite"></i><span class="slotBar"><i></i></span></button><button class="grillSlot"><i class="foodSprite"></i><span class="slotBar"><i></i></span></button><button class="grillSlot"><i class="foodSprite"></i><span class="slotBar"><i></i></span></button></div><div class="grillLegend"><span><i class="dot rawDot"></i>RAW</span><span><i class="dot cookDot"></i>COOKING</span><span><i
