<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
  <meta name="theme-color" content="#15100d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ben's Burgers">
  <title>Ben's Burgers</title>
  <link rel="stylesheet" href="app-v2.css?v=20">
  <link rel="stylesheet" href="visual-v21.css?v=21">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brandBlock">
        <div class="brandMark">BB</div>
        <div><div class="brand">Ben's Burgers</div><div class="tagline">GRILL • STACK • SERVE</div></div>
      </div>
      <div class="stats">
        <div class="pill money">$<span id="money">0.00</span></div>
        <div class="pill">⭐ <span id="score">0</span></div>
        <div class="pill">🔥 <span id="streak">0</span>x</div>
        <div class="pill">👥 <span id="served">0</span></div>
      </div>
    </header>

    <section class="serviceRow">
      <div class="restaurantScene">
        <div class="sceneGlow"></div>
        <div class="counterSign">BEN'S</div>
        <div id="customerEmoji" class="customer">🧑</div>
        <div class="counter"></div>
      </div>
      <article class="ordercard">
        <div class="ticketTop"><span>ORDER #<span id="orderNo">01</span></span><span id="customerName">Lou</span></div>
        <div id="orderText" class="orderText">One cheeseburger, please!</div>
        <div id="orderChips" class="orderChips"></div>
        <div class="patrow"><span>Patience</span><span id="patience">100</span>%</div>
        <div class="patbar"><div id="patfill" class="patfill"></div></div>
      </article>
    </section>

    <section class="kitchenShell">
      <div class="kitchenHeader">
        <div><strong>Kitchen</strong><span id="hint">Tap an ingredient, then a station.</span></div>
        <div class="shiftMeter"><span>SHIFT</span><div><i id="shiftFill"></i></div><b><span id="shiftServed">0</span>/10</b></div>
      </div>
      <div class="kitchen">
        <div class="canvasWrap"><canvas id="kitchenCanvas" aria-label="Burger cooking and assembly area"></canvas></div>
        <aside class="sidePanel">
          <div class="panelCard sodaCard">
            <div class="panelTitle">DRINK STATION</div>
            <button id="sodaStation" class="sodaStation" aria-label="Fill soda">
              <span class="sodaIcon">🥤</span><span id="sodaStatus" class="sodaStatus">NO DRINK</span>
            </button>
          </div>
          <div class="panelCard comboCard"><span>COMBO</span><strong id="comboText">Build clean orders to heat up!</strong></div>
          <button id="serveBtn" class="serve">SERVE ORDER <span>→</span></button>
        </aside>
      </div>
    </section>
  </main>
  <div id="toast" class="toast"></div>
  <div id="scorePop" class="scorePop"></div>
  <script src="visual-v21.js?v=21"></script>
  <script src="engine-v2.js?v=21"></script>
</body>
</html>
